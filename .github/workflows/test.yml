name: Test
on: [push, pull_request]
permissions: {}
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e . pytest pytest-asyncio pytest-cov aresponses mypy ruff
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy aiokilowattlas
      - run: pytest
