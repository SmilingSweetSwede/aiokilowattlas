[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "aiokilowattlas"
version = "0.6.0"
description = "Async client for the Kilowattlas contributed-solar API (device linking, multi-channel raw-sample ingest)."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "SmilingSweetSwede" }]
requires-python = ">=3.12"
dependencies = ["aiohttp>=3.9"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Home Automation",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/SmilingSweetSwede/aiokilowattlas"
Issues = "https://github.com/SmilingSweetSwede/aiokilowattlas/issues"

[tool.hatch.build.targets.sdist]
include = ["aiokilowattlas", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--cov=aiokilowattlas --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
branch = true

[tool.mypy]
strict = true
python_version = "3.12"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
